name: Build and Release BobrDobr VPN

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name=BobrDobr-VPN `
            --onefile `
            --windowed `
            --noconfirm `
            --clean `
            --icon="src/assets/beaver.ico" `
            --paths="src" `
            --add-data="src/gui;gui" `
            --add-data="src/core;core" `
            --add-data="src/utils;utils" `
            --add-data="src/assets;assets" `
            --add-data="bin/windows;bin/windows" `
            --distpath="dist/windows" `
            "src/main.py"

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/BobrDobr-VPN.exe
          name: "БобрДобр VPN ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
