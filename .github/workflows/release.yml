name: Build and Release BobrDobr VPN (Go)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Pure Go Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Install goversioninfo
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate syso resources
        shell: pwsh
        run: |
          goversioninfo -o client-go/cmd/bobrdobr/rsrc_windows_amd64.syso client-go/build/windows/versioninfo.json

      - name: Build Go client (BobrDobr.exe)
        shell: pwsh
        run: |
          cd client-go
          go build -mod=vendor -ldflags="-H windowsgui" -o bin/BobrDobr.exe ./cmd/bobrdobr

      - name: Build openconnect-worker
        shell: pwsh
        run: |
          cd openconnect-worker
          go build -ldflags="-s -w" -o ../bin/windows/openconnect-worker.exe main.go

      - name: Stage Distribution Folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows, dist/installer | Out-Null
          Copy-Item client-go/bin/BobrDobr.exe -Destination dist/windows/BobrDobr.exe -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if (-not $ver -or $ver -eq "") { $ver = "1.3.0" }
          & .\client-go\scripts\Build-Installer.ps1 -Version $ver -NoSign

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/BobrDobr-Setup-*.exe
            dist/windows/BobrDobr.exe
          name: "БобрДобр VPN ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
